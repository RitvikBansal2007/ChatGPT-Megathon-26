# Pre-commit hooks that stop secrets before they reach a commit.
#
# One-time setup per clone:
#   pip install pre-commit
#   pre-commit install
#
# Run on everything at any time:   pre-commit run --all-files
#
# The gitleaks hook reads .gitleaks.toml in the repository root.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
