[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greendash"
version = "0.1.0"
description = "Green Customer Insights Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pyyaml>=6.0.1",
    "pytest>=8.2.0",
    "streamlit>=1.46",
    "scikit-learn>=1.4.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "skops",
    "lightgbm",
    "shap",
    "pyjwt",
    "cryptography",
    "plotly",
    "anthropic",
    "google-genai"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[tool.hatch.build.targets.wheel]
packages = ["greendash", "api"]
